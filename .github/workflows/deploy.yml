name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-wanted-prod
  ACR_NAME: acrwanted890890
  IMAGE_NAME: wanted-backend
  CONTAINER_APP: ca-wanted-api
  STATIC_WEB_APP: swa-wanted-web
  POSTGRES_SERVER: psql-wanted-prod-890890
  KEY_VAULT: kv-wanted-890890

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push backend image
        run: |
          az acr login --name "$ACR_NAME"
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Open database firewall for this runner
        run: |
          RUNNER_IP=$(curl -s https://api.ipify.org)
          az postgres flexible-server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" \
            --server-name "$POSTGRES_SERVER" \
            --name ci-runner \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP"
          sleep 30

      - name: Run database migrations
        working-directory: backend
        run: |
          DATABASE_URL=$(az keyvault secret show --vault-name "$KEY_VAULT" --name database-url --query value -o tsv)
          echo "::add-mask::$DATABASE_URL"
          export DATABASE_URL
          npm ci
          npx prisma migrate deploy

      - name: Close database firewall
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" \
            --server-name "$POSTGRES_SERVER" \
            --name ci-runner \
            --yes

      - name: Update backend to the new image
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"

      - name: Resolve API URL
        id: api
        run: |
          FQDN=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$FQDN" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ steps.api.outputs.url }}
        run: |
          npm ci
          npm run build

      - name: Get Static Web Apps deployment token
        id: swa
        run: |
          TOKEN=$(az staticwebapp secrets list --name "$STATIC_WEB_APP" --resource-group "$RESOURCE_GROUP" --query properties.apiKey -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true

      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "${{ steps.api.outputs.url }}/health/ready"